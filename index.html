<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Pet RPG & Cases</title>
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: fixed;
        }
        canvas {
            display: block;
            margin: 0 auto;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser-ce/2.19.2/phaser.min.js"></script>
</head>
<body>
<script>
var game = new Phaser.Game(1024, 768, Phaser.AUTO, '');

var playerData = {
    name: "ВайбКодер",
    level: 1,
    exp: 0,
    coins: 100,
    pets: [
        { id: 0, name: "Слабый Котёнок", type: "cat", power: 5, rarity: "Обычный", rarityColor: "#ffffff" }
    ],
    equippedPetIndex: 0
};

function saveGame() {
    try {
        localStorage.setItem('vibe_pet_rpg_save', JSON.stringify(playerData));
        console.log('Игра успешно сохранена!', playerData);
    } catch (e) {
        console.log('Ошибка сохранения:', e);
    }
}

function loadGame() {
    try {
        var savedData = localStorage.getItem('vibe_pet_rpg_save');
        if (savedData) {
            var parsed = JSON.parse(savedData);
            playerData.name = parsed.name || playerData.name;
            playerData.level = parsed.level || 1;
            playerData.exp = parsed.exp || 0;
            playerData.coins = parsed.coins !== undefined ? parsed.coins : 100;
            playerData.pets = parsed.pets || playerData.pets;
            playerData.equippedPetIndex = parsed.equippedPetIndex || 0;
            
            if (playerData.equippedPetIndex >= playerData.pets.length) {
                playerData.equippedPetIndex = 0;
            }
            console.log('Сохранение загружено!', playerData);
        } else {
            saveGame();
        }
    } catch (e) {
        console.log('Ошибка загрузки сохранения:', e);
    }
}

loadGame();

var casesData = [];
var petTypes = [
    { type: "cat", namePrefix: "Кот", color: "#f1c40f" },
    { type: "dog", namePrefix: "Пес", color: "#e67e22" },
    { type: "bunny", namePrefix: "Зайка", color: "#e84393" },
    { type: "dragon", namePrefix: "Дракон", color: "#9b59b6" }
];

var rarities = [
    { name: "Обычный", color: "#ffffff", chance: 50 },
    { name: "Редкий", color: "#2196F3", chance: 35 },
    { name: "Эпический", color: "#9C27B0", chance: 12 },
    { name: "Легендарный", color: "#FF9800", chance: 3 }
];

for (var c = 1; c <= 15; c++) {
    var casePets = [];
    for (var p = 1; p <= 15; p++) {
        var rarityIndex = 0;
        var randChance = Math.random() * 100;
        if (c > 10 && randChance < 40) rarityIndex = 3;
        else if (c > 5 && randChance < 50) rarityIndex = 2;
        else if (c > 2 && randChance < 60) rarityIndex = 1;
        else rarityIndex = 0;

        var rarityObj = rarities[rarityIndex];
        var pTemplate = petTypes[Math.floor(Math.random() * petTypes.length)];
        
        casePets.push({
            name: pTemplate.namePrefix + " MK-" + c + "-" + p,
            type: pTemplate.type,
            rarity: rarityObj.name,
            rarityColor: rarityObj.color,
            power: Math.floor((p * 2 + c * 8) * (rarityIndex + 1) * 1.5)
        });
    }
    casesData.push({ 
        id: c, 
        name: "Кейс №" + c, 
        cost: c * 40 + 20, 
        pets: casePets 
    });
}

var selectedCaseIndex = 0;

var PreloadState = {
    preload: function() {
        game.stage.backgroundColor = '#1e272e';
        
        var createPetSprite = function(key, type, mainColor) {
            var bmd = game.add.bitmapData(50, 50);
            var ctx = bmd.ctx;
            ctx.fillStyle = mainColor;
            ctx.beginPath();
            ctx.arc(25, 25, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = mainColor;
            if (type === 'cat') {
                ctx.beginPath(); ctx.moveTo(10, 15); ctx.lineTo(5, 2); ctx.lineTo(20, 10); ctx.fill();
                ctx.beginPath(); ctx.moveTo(40, 15); ctx.lineTo(45, 2); ctx.lineTo(30, 10); ctx.fill();
            } else if (type === 'dog') {
                ctx.fillRect(5, 10, 8, 15);
                ctx.fillRect(37, 10, 8, 15);
            } else if (type === 'bunny') {
                ctx.fillRect(16, -10, 6, 20);
                ctx.fillRect(28, -10, 6, 20);
            } else if (type === 'dragon') {
                ctx.fillStyle = "#e74c3c";
                ctx.beginPath(); ctx.moveTo(15, 10); ctx.lineTo(10, 0); ctx.lineTo(22, 8); ctx.fill();
                ctx.beginPath(); ctx.moveTo(35, 10); ctx.lineTo(40, 0); ctx.lineTo(28, 8); ctx.fill();
            }

            ctx.fillStyle = "#000";
            ctx.fillRect(17, 20, 4, 4);
            ctx.fillRect(29, 20, 4, 4);
            game.cache.addImage(key, null, bmd.canvas);
        };

        createPetSprite('pet_cat', 'cat', '#f1c40f');
        createPetSprite('pet_dog', 'dog', '#e67e22');
        createPetSprite('pet_bunny', 'bunny', '#e84393');
        createPetSprite('pet_dragon', 'dragon', '#9b59b6');

        var capsuleBmd = game.add.bitmapData(50, 80);
        var cCtx = capsuleBmd.ctx;
        cCtx.fillStyle = '#00cec9';
        cCtx.beginPath();
        cCtx.arc(25, 25, 22, Math.PI, 0, false);
        cCtx.fillRect(3, 25, 44, 35);
        cCtx.arc(25, 60, 22, 0, Math.PI, false);
        cCtx.fill();
        cCtx.fillStyle = 'rgba(255,255,255,0.4)';
        cCtx.fillRect(10, 15, 6, 30);
        cCtx.fillStyle = '#2d3436';
        cCtx.beginPath(); cCtx.arc(17, 32, 6, 0, Math.PI * 2); cCtx.fill();
        cCtx.beginPath(); cCtx.arc(33, 32, 6, 0, Math.PI * 2); cCtx.fill();
        cCtx.fillStyle = '#ffffff';
        cCtx.fillRect(19, 29, 2, 2);
        cCtx.fillRect(35, 29, 2, 2);
        game.cache.addImage('hero_capsule', null, capsuleBmd.canvas);

        var createSquare = function(key, w, h, color) {
            var bmd = game.add.bitmapData(w, h);
            bmd.ctx.fillStyle = color;
            bmd.ctx.fillRect(0, 0, w, h);
            game.cache.addImage(key, null, bmd.canvas);
        };

        createSquare('btn_pl', 200, 60, '#ffffff');
        createSquare('zombie', 55, 80, '#2ecc71');
        createSquare('ground', 1024, 60, '#795548');
        createSquare('bullet', 25, 12, '#e74c3c');
        
        var wheelBmd = game.add.bitmapData(200, 200);
        var wCtx = wheelBmd.ctx;
        wCtx.fillStyle = '#e74c3c';
        wCtx.beginPath(); wCtx.arc(100, 100, 95, Math.PI / 2, Math.PI * 1.5); wCtx.fill();
        wCtx.fillStyle = '#2ecc71';
        wCtx.beginPath(); wCtx.arc(100, 100, 95, Math.PI * 1.5, Math.PI / 2); wCtx.fill();
        wCtx.fillStyle = '#1e272e';
        wCtx.beginPath(); wCtx.arc(100, 100, 75, 0, Math.PI * 2); wCtx.fill();
        game.cache.addImage('upgrade_wheel', null, wheelBmd.canvas);

        var arrowBmd = game.add.bitmapData(10, 100);
        arrowBmd.ctx.fillStyle = '#ffffff';
        arrowBmd.ctx.fillRect(3, 0, 4, 100);
        game.cache.addImage('arrow', null, arrowBmd.canvas);
    },
    create: function() {
        game.scale.scaleMode = Phaser.ScaleManager.SHOW_ALL;
        game.scale.pageAlignHorizontally = true;
        game.scale.pageAlignVertically = true;
        game.scale.refresh();
        game.state.start('MainMenu');
    }
};

function getPetTexture(type) {
    if (type === 'dog') return 'pet_dog';
    if (type === 'bunny') return 'pet_bunny';
    if (type === 'dragon') return 'pet_dragon';
    return 'pet_cat';
}

function makeBtn(x, y, text, color, callback, context, scaleX) {
    scaleX = scaleX || 1.5;
    var btn = game.add.button(x, y, 'btn_pl', callback, context);
    btn.anchor.set(0.5);
    btn.scale.setTo(scaleX, 1);
    btn.tint = parseInt(color.replace('#', '0x'));
    var txt = game.add.text(x, y + 2, text, { font: "20px Arial", fill: "#ffffff", fontWeight: "bold" });
    txt.anchor.set(0.5);
    return { btn: btn, txt: txt };
}

var MainMenuState = {
    create: function() {
        game.stage.backgroundColor = '#1e272e';

        var title = game.add.text(game.world.centerX, 70, "PETS & ZOMBIES RPG", { font: "42px Arial", fill: "#fff", fontWeight: "bold" });
        title.anchor.set(0.5);

        var currentPet = playerData.pets[playerData.equippedPetIndex];
        var petTex = currentPet ? getPetTexture(currentPet.type) : 'pet_cat';
        
        this.bgPet = game.add.sprite(game.world.centerX, 150, petTex);
        this.bgPet.anchor.set(0.5);
        this.bgPet.scale.setTo(2, 2);
        
        game.add.tween(this.bgPet).to({ y: 162 }, 800, Phaser.Easing.Sinusoidal.InOut, true, 0, -1, true);

        makeBtn(game.world.centerX, 250, "ИГРАТЬ", "#4CAF50", function() { game.state.start('Gameplay'); }, this, 2.2);
        makeBtn(game.world.centerX, 335, "МАГАЗИН КЕЙСОВ", "#FF9800", function() { game.state.start('Shop'); }, this, 2.2);
        makeBtn(game.world.centerX, 420, "ИНВЕНТАРЬ", "#2196F3", function() { game.state.start('Inventory'); }, this, 2.2);
        makeBtn(game.world.centerX, 505, "АПГРЕЙДЕР (БЕСПЛАТНО)", "#9C27B0", function() { game.state.start('Upgrader'); }, this, 2.2);
        makeBtn(game.world.centerX, 590, "ПРОФИЛЬ", "#795548", function() { game.state.start('Profile'); }, this, 2.2);
        
        makeBtn(game.world.centerX, 675, "СОХРАНИТЬ ИГРУ", "#00bcd4", function() { 
            saveGame();
            alert("Игра успешно сохранена в память браузера!");
        }, this, 2.2);
    }
};

var ProfileState = {
    create: function() {
        game.add.text(100, 80, "=== ПРОФИЛЬ ИГРОКА ===", { font: "36px Arial", fill: "#fff" });
        game.add.text(100, 180, "Никнейм: " + playerData.name, { font: "26px Arial", fill: "#fff" });
        game.add.text(100, 240, "Уровень: " + playerData.level, { font: "26px Arial", fill: "#ffeb3b" });
        game.add.text(100, 300, "Опыт: " + playerData.exp + " / " + (playerData.level * 100), { font: "26px Arial", fill: "#e0e0e0" });
        game.add.text(100, 360, "Монеты: " + playerData.coins + " 💰", { font: "26px Arial", fill: "#4caf50" });
        
        var currentPet = playerData.pets[playerData.equippedPetIndex];
        game.add.text(100, 420, "Активный питомец: " + (currentPet ? currentPet.name + " (Сила: " + currentPet.power + ")" : "Нет"), { font: "26px Arial", fill: "#00bcd4" });

        makeBtn(game.world.centerX, 650, "НАЗАД В МЕНЮ", "#555555", function() { game.state.start('MainMenu'); }, this, 2);
    }
};

var GameplayState = {
    create: function() {
        game.physics.startSystem(Phaser.Physics.ARCADE);
        game.stage.backgroundColor = '#85c1e9';
        
        this.ground = game.add.sprite(0, 600, 'ground');
        game.physics.arcade.enable(this.ground);
        this.ground.body.immovable = true;

        this.hero = game.add.sprite(150, 400, 'hero_capsule');
        game.physics.arcade.enable(this.hero);
        this.hero.body.gravity.y = 1000;
        this.hero.body.collideWorldBounds = true;

        var currentPet = playerData.pets[playerData.equippedPetIndex];
        var petTex = currentPet ? getPetTexture(currentPet.type) : 'pet_cat';
        this.pet = game.add.sprite(90, 450, petTex);
        game.physics.arcade.enable(this.pet);

        this.zombies = game.add.group();
        this.zombies.enableBody = true;
        this.bullets = game.add.group();
        this.bullets.enableBody = true;

        this.uiText = game.add.text(20, 20, "", { font: "20px Arial", fill: "#fff", stroke: "#000", strokeThickness: 3 });
        this.updateUI();

        this.zombieTimer = game.time.events.loop(3500, this.spawnZombie, this);
        this.spawnZombie();

        this.moveLeft = false;
        this.moveRight = false;

        var btnL = makeBtn(90, 680, "◀ ВЛЕВО", "#333333", null, this, 0.8);
        btnL.btn.onInputDown.add(function(){ this.moveLeft = true; }, this);
        btnL.btn.onInputUp.add(function(){ this.moveLeft = false; }, this);

        var btnR = makeBtn(270, 680, "ВПРАВО ▶", "#333333", null, this, 0.8);
        btnR.btn.onInputDown.add(function(){ this.moveRight = true; }, this);
        btnR.btn.onInputUp.add(function(){ this.moveRight = false; }, this);

        makeBtn(750, 680, "ПРЫЖОК ⬆", "#2980b9", this.jump, this, 0.8);
        makeBtn(930, 680, "УДАР ⚔", "#c0392b", this.attack, this, 0.8);

        makeBtn(930, 40, "В МЕНЮ", "#555555", function() { 
            game.time.events.remove(this.zombieTimer);
            saveGame();
            game.state.start('MainMenu'); 
        }, this, 1);
    },

    updateUI: function() {
        var p = playerData.pets[playerData.equippedPetIndex];
        var pName = p ? p.name : "Нет";
        var pPower = p ? p.power : 0;
        this.uiText.setText("Ур: " + playerData.level + " | Опыт: " + playerData.exp + " | Монеты: " + playerData.coins + " 💰\nПитомец: " + pName + " (Сила: " + pPower + ")");
    },

    spawnZombie: function() {
        var z = this.zombies.create(1000, 520, 'zombie');
        z.body.velocity.x = -50 - (playerData.level * 4);
        z.hp = 25 + (playerData.level * 12);
    },

    jump: function() {
        if (this.hero.body.touching.down) {
            this.hero.body.velocity.y = -500;
        }
    },

    attack: function() {
        var p = playerData.pets[playerData.equippedPetIndex];
        var damage = p ? p.power : 3;
        
        var b = this.bullets.create(this.hero.x + 40, this.hero.y + 20, 'bullet');
        b.body.velocity.x = 500;
        b.damage = damage;
    },

    update: function() {
        game.physics.arcade.collide(this.hero, this.ground);
        game.physics.arcade.collide(this.zombies, this.ground);
        
        this.pet.x = this.hero.x - 50;
        this.pet.y = this.hero.y + 35;

        this.hero.body.velocity.x = 0;
        if (this.moveLeft) this.hero.body.velocity.x = -200;
        if (this.moveRight) this.hero.body.velocity.x = 200;

        game.physics.arcade.overlap(this.bullets, this.zombies, function(bullet, zombie) {
            zombie.hp -= bullet.damage;
            bullet.kill();
            if (zombie.hp <= 0) {
                zombie.kill();
                playerData.coins += 15;
                playerData.exp += 25;
                
                if (playerData.exp >= playerData.level * 100) {
                    playerData.exp = 0;
                    playerData.level++;
                }
                this.updateUI();
                saveGame();
            }
        }, null, this);

        this.zombies.forEach(function(z) {
            if (z.x < -50) z.kill();
        }, this);
    }
};

var ShopState = {
    create: function() {
        game.add.text(50, 30, "МАГАЗИН КЕЙСОВ (15 кейсов)", { font: "32px Arial", fill: "#fff", fontWeight: "bold" });
        this.coinText = game.add.text(720, 35, "Монеты: " + playerData.coins + " 💰", { font: "22px Arial", fill: "#4caf50" });

        var startX = 80;
        var startY = 120;
        var spacingX = 180;
        var spacingY = 110;

        for (var i = 0; i < casesData.length; i++) {
            var col = i % 5;
            var row = Math.floor(i / 5);
            var x = startX + col * spacingX;
            var y = startY + row * spacingY;

            (function(caseIndex) {
                var btn = game.add.button(x, y, 'btn_pl', function() {
                    selectedCaseIndex = caseIndex;
                    game.state.start('CaseOpen');
                }, this);
                btn.anchor.set(0.5);
                btn.scale.setTo(0.8, 0.7);
                btn.tint = (caseIndex > 9) ? 0xFF9800 : ((caseIndex > 4) ? 0x9C27B0 : 0x2196F3);

                game.add.text(x, y - 12, casesData[caseIndex].name, { font: "15px Arial", fill: "#fff", fontWeight: "bold" }).anchor.set(0.5);
                game.add.text(x, y + 12, casesData[caseIndex].cost + " 💰", { font: "14px Arial", fill: "#ffeb3b" }).anchor.set(0.5);
            })(i);
        }

        makeBtn(game.world.centerX, 680, "НАЗАД В МЕНЮ", "#555555", function() { game.state.start('MainMenu'); }, this, 2);
    }
};

var CaseOpenState = {
    create: function() {
        var cData = casesData[selectedCaseIndex];
        
        game.add.text(game.world.centerX, 80, "ОТКРЫТИЕ: " + cData.name, { font: "32px Arial", fill: "#fff" }).anchor.set(0.5);
        this.infoText = game.add.text(game.world.centerX, 130, "Стоимость: " + cData.cost + " монет (15 питомцев в кейсе)", { font: "20px Arial", fill: "#ffeb3b" });
        this.infoText.anchor.set(0.5);

        this.resultBox = game.add.text(game.world.centerX, 320, "Нажми «Открыть», чтобы испытать удачу!", { font: "24px Arial", fill: "#fff", align: "center" });
        this.resultBox.anchor.set(0.5);

        makeBtn(game.world.centerX, 500, "ОТКРЫТЬ КЕЙС!", "#e74c3c", function() {
            if (playerData.coins >= cData.cost) {
                playerData.coins -= cData.cost;
                var randomPet = cData.pets[Math.floor(Math.random() * cData.pets.length)];
                playerData.pets.push(randomPet);
                
                this.resultBox.setText("🎉 ВЫ ВЫИГРАЛИ!\n" + randomPet.name + "\nРедкость: " + randomPet.rarity + "\nСила: " + randomPet.power);
                this.resultBox.fill = randomPet.rarityColor;
                saveGame();
            } else {
                this.resultBox.setText("❌ Не хватает монет! Иди бей зомби!");
                this.resultBox.fill = "#e74c3c";
            }
        }, this, 2.5);

        makeBtn(game.world.centerX, 630, "НАЗАД В МАГАЗИН", "#555555", function() { game.state.start('Shop'); }, this, 2);
    }
};

var InventoryState = {
    create: function() {
        game.add.text(50, 30, "ИНВЕНТАРЬ ПИТОМЦЕВ", { font: "32px Arial", fill: "#fff", fontWeight: "bold" });
        this.coinText = game.add.text(750, 35, "Монеты: " + playerData.coins + " 💰", { font: "22px Arial", fill: "#4caf50" });

        var startX = 80;
        var startY = 120;
        var spacingX = 220;
        var spacingY = 130;
        
        for (var i = 0; i < playerData.pets.length && i < 12; i++) {
            var pet = playerData.pets[i];
            var col = i % 4;
            var row = Math.floor(i / 4);
            var x = startX + col * spacingX;
            var y = startY + row * spacingY;

            (function(index, pX, pY) {
                var card = game.add.button(pX, pY, 'btn_pl', function() {
                    playerData.equippedPetIndex = index;
                    saveGame();
                    game.state.restart();
                }, this);
                card.scale.setTo(0.9, 0.8);
                card.tint = (playerData.equippedPetIndex === index) ? 0x2ecc71 : 0x34495e;

                game.add.text(pX - 85, pY - 35, pet.name, { font: "15px Arial", fill: "#fff", fontWeight: "bold" });
                game.add.text(pX - 85, pY - 15, "Сила: " + pet.power, { font: "13px Arial", fill: "#ffeb3b" });
                game.add.text(pX - 85, pY + 3, pet.rarity, { font: "13px Arial", fill: pet.rarityColor });

                if (playerData.equippedPetIndex !== index && playerData.pets.length > 1) {
                    var sellBtn = game.add.button(pX + 30, pY + 12, 'btn_pl', function() {
                        var refund = Math.floor(pet.power * 1.5);
                        playerData.coins += refund;
                        playerData.pets.splice(index, 1);
                        if (playerData.equippedPetIndex >= playerData.pets.length) {
                            playerData.equippedPetIndex = 0;
                        }
                        saveGame();
                        game.state.restart();
                    }, this);
                    sellBtn.anchor.set(0.5);
                    sellBtn.scale.setTo(0.35, 0.35);
                    sellBtn.tint = 0xe74c3c;
                    game.add.text(pX + 30, pY + 13, "СДАТЬ", { font: "10px Arial", fill: "#fff", fontWeight: "bold" }).anchor.set(0.5);
                }
            })(i, x, y);
        }

        makeBtn(game.world.centerX, 680, "НАЗАД В МЕНЮ", "#555555", function() { game.state.start('MainMenu'); }, this, 2);
    }
};

var UpgraderState = {
    create: function() {
        game.add.text(game.world.centerX, 50, "АПГРЕЙДЕР 50 / 50 (БЕСПЛАТНО)", { font: "34px Arial", fill: "#fff", fontWeight: "bold" }).anchor.set(0.5);
        this.coinText = game.add.text(750, 55, "Монеты: " + playerData.coins + " 💰", { font: "22px Arial", fill: "#4caf50" });
        
        var currentPet = playerData.pets[playerData.equippedPetIndex];
        game.add.text(game.world.centerX, 100, "Питомец на кон: " + (currentPet ? currentPet.name + " (Сила: " + currentPet.power + ")" : "Нет"), { font: "20px Arial", fill: "#ffeb3b" }).anchor.set(0.5);

        this.wheel = game.add.sprite(game.world.centerX, 250, 'upgrade_wheel');
        this.wheel.anchor.set(0.5);

        this.arrow = game.add.sprite(game.world.centerX, 250, 'arrow');
        this.arrow.anchor.set(0.5, 1.0);
        this.arrow.angle = 0;

        this.statusText = game.add.text(game.world.centerX, 390, "Зеленое = Новый х2 сильный питомец\nКрасное = Потеря питомца", { font: "18px Arial", fill: "#fff", align: "center" });
        this.statusText.anchor.set(0.5);

        this.isSpinning = false;

        makeBtn(game.world.centerX, 520, "КРУТИТЬ (БЕСПЛАТНО)", "#9C27B0", this.spinUpgrader, this, 2.5);
        makeBtn(game.world.centerX, 640, "НАЗАД В МЕНЮ", "#555555", function() { game.state.start('MainMenu'); }, this, 2);
    },

    spinUpgrader: function() {
        if (this.isSpinning) return;
        if (playerData.pets.length <= 1) {
            this.statusText.setText("❌ Нельзя ставить последнего питомца!");
            return;
        }

        this.isSpinning = true;
        this.statusText.setText("🔄 Колесо крутится...");

        var randomAngle = Math.random() * 720 + 1080; 
        var rotationTween = game.add.tween(this.arrow).to({ angle: randomAngle }, 2000, Phaser.Easing.Cubic.Out, true);
        
        rotationTween.onComplete.add(function() {
            this.isSpinning = false;
            var finalAngle = ((this.arrow.angle % 360) + 360) % 360;
            
            if (finalAngle >= 0 && finalAngle <= 180) {
                var oldPet = playerData.pets[playerData.equippedPetIndex];
                var tpl = petTypes[Math.floor(Math.random() * petTypes.length)];
                var newPower = oldPet.power * 2;
                
                var upgradedPet = {
                    name: tpl.namePrefix + " Апгрейд",
                    type: tpl.type,
                    rarity: "Эпический",
                    rarityColor: "#9C27B0",
                    power: newPower
                };

                playerData.pets[playerData.equippedPetIndex] = upgradedPet;
                this.statusText.setText("🎉 УСПЕХ! Питомца заменил:\n" + upgradedPet.name + " (Сила: " + newPower + ")");
            } else {
                var lostPetName = playerData.pets[playerData.equippedPetIndex].name;
                playerData.pets.splice(playerData.equippedPetIndex, 1);
                playerData.equippedPetIndex = 0;
                this.statusText.setText("😢 НЕУДАЧА! Питомца «" + lostPetName + "» забрали!");
            }
            saveGame();
        }, this);
    }
};

game.state.add('Preload', PreloadState);
game.state.add('MainMenu', MainMenuState);
game.state.add('Profile', ProfileState);
game.state.add('Gameplay', GameplayState);
game.state.add('Shop', ShopState);
game.state.add('CaseOpen', CaseOpenState);
game.state.add('Inventory', InventoryState);
game.state.add('Upgrader', UpgraderState);

game.state.start('Preload');
</script>
